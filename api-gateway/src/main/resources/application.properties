# Server Port
server.port=8080

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Spring Application Name
spring.application.name=api-gateway

# Gateway Global Secrets
# IMPORTANT: Store these securely in production (e.g., environment variables, Vault)
# This JWT secret MUST match the secret used by your Auth-Service to sign tokens.
spring.cloud.gateway.jwt.secret-key=averylongandsecuresecretkeythatismorethan256bitssolongthatitwillbehardtoguess
# This internal gateway secret is shared between Gateway and ALL microservices it routes to.
spring.cloud.gateway.internal-gateway.secret-key=your_super_secret_internal_gateway_key_1234567890abcdef

# Default filters applied to ALL routes (e.g., for general header management)
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Request-Method Access-Control-Request-Headers
spring.cloud.gateway.default-filters[1]=RemoveResponseHeader=X-Powered-By

# Global CORS Configuration for the API Gateway
# Only the API Gateway needs this, as it's the only service directly exposed to the frontend.
spring.webflux.cors.enabled=true
spring.webflux.cors.paths=/**
spring.webflux.cors.allowed-origins=* # In production, restrict this to your frontend's domain(s)
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webflux.cors.allowed-headers=*
spring.webflux.cors.allow-credentials=true

# ROUTE DEFINITIONS
spring.cloud.gateway.routes[0].id=auth-service-login
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/login
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/auth/(?<segment>.*), /auth/$\{segment}
spring.cloud.gateway.routes[0].filters[1]=InternalSecurityHeader # No TokenValidation or Authorization for login

spring.cloud.gateway.routes[1].id=auth-service-register
spring.cloud.gateway.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/register
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/auth/(?<segment>.*), /auth/$\{segment}
spring.cloud.gateway.routes[1].filters[1]=InternalSecurityHeader # No TokenValidation or Authorization for register

# --- Protected Auth Service Route (/me) ---
spring.cloud.gateway.routes[2].id=auth-service-protected-me
spring.cloud.gateway.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/me
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/auth/(?<segment>.*), /auth/$\{segment}
spring.cloud.gateway.routes[2].filters[1]=TokenValidation # 1. Validate JWT
spring.cloud.gateway.routes[2].filters[2]=Authorization # 2. Check roles for the path
spring.cloud.gateway.routes[2].filters[3]=InternalSecurityHeader # 3. Add internal token for downstream

# --- Product Service Protected Routes ---
spring.cloud.gateway.routes[3].id=product-service
spring.cloud.gateway.routes[3].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/products/(?<segment>.*), /api/products/$\{segment}
spring.cloud.gateway.routes[3].filters[1]=TokenValidation
spring.cloud.gateway.routes[3].filters[2]=Authorization
spring.cloud.gateway.routes[3].filters[3]=InternalSecurityHeader

# --- Category Service Protected Routes ---
spring.cloud.gateway.routes[4].id=category-service
spring.cloud.gateway.routes[4].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/categories/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/categories/(?<segment>.*), /api/categories/$\{segment}
spring.cloud.gateway.routes[4].filters[1]=TokenValidation
spring.cloud.gateway.routes[4].filters[2]=Authorization
spring.cloud.gateway.routes[4].filters[3]=InternalSecurityHeader

# --- Cart Service Protected Routes ---
spring.cloud.gateway.routes[5].id=cart-service
spring.cloud.gateway.routes[5].uri=lb://CART-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/carts/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/carts/(?<segment>.*), /api/carts/$\{segment}
spring.cloud.gateway.routes[5].filters[1]=TokenValidation
spring.cloud.gateway.routes[5].filters[2]=Authorization
spring.cloud.gateway.routes[5].filters[3]=InternalSecurityHeader
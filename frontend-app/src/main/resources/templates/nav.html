<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block layout:fragment="output">
        <link rel="stylesheet" th:href="@{/css/output.css}">
    </th:block>
</head>
<body>

<nav class="bg-white border-gray-200 dark:bg-gray-900" th:fragment="navbar">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
        <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white">eShop</span>
    </a>
    <button data-collapse-toggle="navbar-default" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600" aria-controls="navbar-default" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
        </svg>
    </button>
    <div class="hidden w-full md:block md:w-auto" id="navbar-default">
      <ul class="flex flex-wrap items-center font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700">
        <li sec:authorize="isAuthenticated()">
          <a th:href="@{/home}" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Home</a>
        </li>
        <li sec:authorize="isAuthenticated()">
          <a th:href="@{/api/products}" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Products</a>
        </li>
        <li sec:authorize="isAuthenticated()">
          <a th:href="@{/api/shopping-cart/view}" class="relative block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">
            Shopping Cart
            <span th:if="${cartItemCount > 0}"
                th:text="${cartItemCount}"
                class="absolute -bottom-2 -right-4 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white bg-red-600 rounded-full">
            </span>
          </a>
        </li>
        <li sec:authorize="isAuthenticated() and hasRole('ROLE_ADMIN')">
            <form th:action="@{/api/products/create}" method="get">
                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white py-1 px-3 rounded-md">Add Product</button>
            </form>
        </li>
        <li sec:authorize="isAuthenticated() and hasRole('ROLE_ADMIN')">
            <form th:action="@{/api/categories/create}" method="get">
                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white py-1 px-3 rounded-md">Add Category</button>
            </form>
        </li>
        <li sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white py-1 px-3 rounded-md">Logout</button>
            </form>
        </li>
        <li sec:authorize="!isAuthenticated()">
            <form th:action="@{/register}" method="post">
                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white py-1 px-3 rounded-md">Register</button>
            </form>
        </li>
        <li sec:authorize="!isAuthenticated()">
            <form th:action="@{/login}" method="post">
                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white py-1 px-3 rounded-md">Login</button>
            </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

</body>
</html>
